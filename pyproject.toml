[build-system]
requires = ["uv_build >= 0.10.10, <0.12.0"]
build-backend = "uv_build"

[project]
name = "EquFlash"
version = "0.0.2"
description = "GGNN: EquFlashV2"
readme = "README.md"
requires-python = ">=3.12"
dynamic = []

dependencies = [
    "torch==2.9.1+cu126",
    "torch_scatter==2.1.2+pt29cu126",
    "torch_sparse==0.6.18+pt29cu126",
    "torch_geometric==2.6.1",

    "scipy==1.16.1",
    "ase>=3.26.0",
    "e3nn==0.5.6",

    "huggingface-hub",
    "hydra-core",

    "lmdb==1.6.2",
    "numba",
    "numpy==1.26.4",

    "orjson",
    "pydantic",

    "pymatgen==2025.10.7",

    "pyyaml",
    "requests",

    "submitit==1.5.3",

    "tensorboard",
    "torchtnt",
    "tqdm",
    "wandb",
    "wheel",

    "scikit-learn",

    "cuequivariance==0.6.0",
    "cuequivariance-torch==0.6.0",
    "cuequivariance-ops-torch-cu12==0.6.0",

    "ase_db_backends==0.11.0",
    "nvalchemi-toolkit-ops==0.3.0",

    "fairchem-core",
]

[tool.uv]
index-strategy = "unsafe-best-match"
find-links = ["https://data.pyg.org/whl/torch-2.9.1+cu126.html"]

[tool.uv.build-backend]
module-name = "GGNN"
module-root = ""

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

[tool.uv.sources]
fairchem-core = { path = "./fairchem" }

[tool.uv_build]
include = ["GGNN/**/*.pyi", "GGNN/py.typed"]

[project.urls]
Repository = "https://github.com/daniisler/GGNN/tree/feature-python-package"